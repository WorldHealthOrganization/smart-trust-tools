notes: >-
  The signatures are DER-encoded ECDSA (71-72 bytes), not the 64-byte r||s
  RFC 7518 3.4 requires; the payload of the detached b64:false JWS is the 64
  raw bytes SHA-256(proof options) || SHA-256(document). Test data from the
  DEV environment; the documents are re-signed daily, so a later copy has a
  different proof but the same document hash.
