name: Site (GitHub Pages)

# Builds the viewer site on every push. The default branch deploys to the
# root of gh-pages; other branches deploy to gh-pages/branches/<last path
# component>, as the WHO SMART IG repositories do.

on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pyyaml markdown rdflib cbor2 base45
      - name: Build site
        env:
          SITE_GIT_REF: ${{ github.ref_name }}
        run: tools/build_site.sh site
      - name: Choose target folder
        id: target
        run: |
          if [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "dir=branches/${GITHUB_REF_NAME##*/}" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          target-folder: ${{ steps.target.outputs.dir }}
          clean: true
          clean-exclude: |
            branches
