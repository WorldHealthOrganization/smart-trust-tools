name: Requirements graph, API contract and Kotlin library

# Every dependency is pinned: actions by commit SHA, Python by hash
# (toolchain/python/requirements.txt), Node tools by lockfile integrity
# (toolchain/node/package-lock.json, installed with --ignore-scripts), Gradle by
# verification metadata.
permissions:
  contents: read

on:
  push:
    paths: ["skills/**", "library/**", "external-schemas/**", "references/**", "memory/**", "beans/**", "processes/**", "scenarios/**", "api/**", "models/**", "vectors/**", "tools/**", "toolchain/**", ".github/workflows/requirements-kg.yml"]
  pull_request:
    paths: ["skills/**", "library/**", "external-schemas/**", "references/**", "memory/**", "beans/**", "processes/**", "scenarios/**", "api/**", "models/**", "vectors/**", "tools/**", "toolchain/**", ".github/workflows/requirements-kg.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Python tools, hash-pinned
        run: pip install --require-hashes --no-deps -r toolchain/python/requirements.txt
      - name: Every edge of the requirement graph names a node
        # The Tool edges need the harness mounted (tools/index.ts imports it);
        # the site build's pre step, check:req-nodes, covers them.
        run: python3 tools/build-site/kg_nodes.py
      - name: Validate WIT and check generated TypeScript is current
        run: |
          tools/gen-api-types/gen_api_types.sh
          git diff --exit-code -- api/generated/ts
      - name: Library test plan is current with the success criteria
        run: python3 tools/test-plan/make_test_plan.py --check
      - name: Check derived payload models are current
        run: python3 tools/lm-derive/lm_derive.py --check
      - name: Validate vectors against CDDL and SHACL
        run: python3 tools/check-models/check_models.py

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "8.14.3"
      - name: Kotlin skeleton is current with the WIT
        run: python3 tools/wit2kotlin/wit2kotlin.py --check
      # tools/hcert-kotlin/gradle/verification-metadata.xml pins the sha256 of every
      # plugin and library Gradle resolves; an unlisted or changed artifact
      # fails the build.
      - name: Compile (JVM + JS) and run the hcert-core tests on the JVM
        run: gradle -p tools/hcert-kotlin --no-daemon compileKotlinJvm compileKotlinJs :hcert-core:jvmTest :hcert-core:jvmTestCoverageCheck :hcert-core:compileProductionLibraryKotlinJs
      - name: Run hcert-core on Node against the PR 129 vector
        run: node tools/hcert-kotlin/hcert-core/node-smoke.mjs
      # The same TypeScript suite the rust job runs on the component (STT-TST-007).
      - name: Run the TypeScript conformance suite on the Kotlin/JS package
        run: node tools/conformance-ts/run.mjs kotlin tools/hcert-kotlin/hcert-core/build/compileSync/js/main/productionLibrary/kotlin


  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/hcert-rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # rust-toolchain.toml pins the compiler (1.97.0) and the wasm32 target;
      # rustup on the runner installs exactly that. Cargo.lock pins every crate
      # with its checksum, and --locked refuses to resolve anything new.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Test the library, natively
        run: cargo test --locked
      - name: Test with the demos' QR encoder (feature qr)
        run: cargo test --locked --features qr --test api
      - name: Build the WebAssembly module, as the demos load it
        run: cargo build --locked --release --features qr --target wasm32-unknown-unknown
      - name: Run the WebAssembly module on Node, with WebCrypto keys
        run: node js/smoke.mjs
      # The WIT component (STT-GEN-005): wit-bindgen bindings for api/wit,
      # componentised and transpiled by the pinned jco in toolchain/node.
      - name: Build the WebAssembly component and transpile it with jco
        run: ./build-component.sh "$RUNNER_TEMP/component"
      - name: Drive every interface of the component on Node
        run: node js/component/component-test.mjs "$RUNNER_TEMP/component"
      # One suite for both libraries, type-checked against api/generated/ts
      # (STT-TST-007); the kotlin job runs it on the Kotlin/JS package.
      - name: Type-check the TypeScript conformance suite
        run: ../../toolchain/node/node_modules/.bin/tsc -p ../conformance-ts/tsconfig.json
      - name: Run the TypeScript conformance suite on the component
        run: node ../conformance-ts/run.mjs rust "$RUNNER_TEMP/component"
