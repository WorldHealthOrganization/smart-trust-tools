name: Requirements KG

on:
  push:
    paths: ["requirements/**", "tools/build_kg.py", ".github/workflows/requirements-kg.yml"]
  pull_request:
    paths: ["requirements/**", "tools/build_kg.py", ".github/workflows/requirements-kg.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml rdflib
      - name: Validate KG and check generated files are current
        run: python3 tools/build_kg.py --check
      - name: Parse generated RDF
        run: |
          python3 -c "
          import rdflib
          from rdflib.compare import isomorphic
          a = rdflib.Graph().parse('requirements/generated/kg.ttl', format='turtle')
          b = rdflib.Graph().parse('requirements/generated/kg.jsonld', format='json-ld')
          assert isomorphic(a, b), 'Turtle and JSON-LD differ'
          print(len(a), 'triples')
          "
