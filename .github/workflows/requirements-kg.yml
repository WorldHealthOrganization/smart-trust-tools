name: Requirements KG and API contract

# Every dependency is pinned: actions by commit SHA, Python by hash
# (tools/python/requirements.txt), Node tools by lockfile integrity
# (tools/node/package-lock.json, installed with --ignore-scripts), Gradle by
# verification metadata.
permissions:
  contents: read

on:
  push:
    paths: ["requirements/**", "skills/**", "api/**", "models/**", "vectors/**", "tools/**", "kotlin/**", ".github/workflows/requirements-kg.yml"]
  pull_request:
    paths: ["requirements/**", "skills/**", "api/**", "models/**", "vectors/**", "tools/**", "kotlin/**", ".github/workflows/requirements-kg.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Python tools, hash-pinned
        run: pip install --require-hashes --no-deps -r tools/python/requirements.txt
      - name: Validate KG (incl. WIT references) and check generated files are current
        run: python3 tools/build_kg.py --check
      - name: Parse generated RDF
        run: |
          python3 -c "
          import rdflib
          from rdflib.compare import isomorphic
          a = rdflib.Graph().parse('requirements/generated/kg.ttl', format='turtle')
          b = rdflib.Graph().parse('requirements/generated/kg.jsonld', format='json-ld')
          assert isomorphic(a, b), 'Turtle and JSON-LD differ'
          print(len(a), 'triples')
          "
      - name: Validate WIT and check generated TypeScript is current
        run: |
          tools/gen_api_types.sh
          git diff --exit-code -- api/generated/ts
      - name: Check derived payload models are current
        run: python3 tools/lm_derive.py --check
      - name: Validate vectors against CDDL and SHACL
        run: python3 tools/check_models.py

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "8.14.3"
      - name: Kotlin skeleton is current with the WIT
        run: python3 tools/wit2kotlin.py --check
      # kotlin/gradle/verification-metadata.xml pins the sha256 of every
      # plugin and library Gradle resolves; an unlisted or changed artifact
      # fails the build.
      - name: Compile the Kotlin skeleton (JVM + JS)
        run: gradle -p kotlin --no-daemon compileKotlinJvm compileKotlinJs

