# The HCERT QR pipeline, as laid out in QR Code Generation section 1.
# Issuance runs the steps top-down. Verification runs them bottom-up
# (QR Code Generation section 11), with trust-list lookup in between.

steps:
  - {id: step-1, order: 1, name: Select payload type, output: "hcert subclaim + logical model", src: qr-2}
  - {id: step-2, order: 2, name: Assemble payload, output: "logical-model instance", src: qr-3}
  - {id: step-3, order: 3, name: Wrap in CWT claim set, output: "{1: iss, 6: iat, 4: exp, -260: {subclaim: payload}}", src: qr-4}
  - {id: step-4, order: 4, name: Serialise as CBOR, output: "bytes", src: qr-5}
  - {id: step-5, order: 5, name: "Sign as COSE_Sign1", output: "bytes, CBOR tag 18", src: qr-6}
  - {id: step-6, order: 6, name: "Compress with ZLIB/Deflate", output: "bytes", src: qr-7}
  - {id: step-7, order: 7, name: Encode as Base45, output: "ASCII", src: qr-8}
  - {id: step-8, order: 8, name: "Prefix context identifier HC1:", output: "ASCII", src: qr-9}
  - {id: step-9, order: 9, name: "Render QR (Alphanumeric, EC Q)", output: "QR symbol", src: qr-10}
  - {id: step-verify, order: 10, name: "Verify (steps 9 to 1 in reverse, plus trust list lookup)", output: "verified payload or typed failure", src: qr-11}
  - {id: step-trust, order: 11, name: Obtain trusted DSCs, output: "candidate DSCs for a kid", src: hcert-A}
