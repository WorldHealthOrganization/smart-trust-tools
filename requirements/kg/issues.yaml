# Open issues found while deriving the requirements: gaps, ambiguities or
# inconsistencies in the sources. Each one is linked from the requirements it
# affects. `upstream: true` means the fix belongs in smart-trust, not here.

issues:
  - id: OI-01
    title: Reference script output is not reproducible byte for byte
    upstream: true
    sources: [qr-12, qr-13, doc-qr-script]
    description: >-
      QR Code Generation 12 and 13 say the script "regenerates the example
      above byte for byte". It does not. The DSC is signed by the SCA, and the
      COSE_Sign1 by the DSC, using randomized ECDSA, so every run produces a
      different DSC, a different kid and different HC1 strings. Running the
      script at PR head 50bcb25 twice produced kids ZfzK2Csfpsk= and
      2sMkNOHFctA=, against WHM+BYqqZiE= in the PR, and different HC1 strings
      on every run. The committed
      artefacts are internally consistent: both committed HC1 strings verify
      against the committed DSC and the kid matches. The sizes in 12.5 are not
      stable either: the deflated size came out as 283 bytes instead of 282,
      and the HC1 length as 429 characters instead of 427.
    resolution_hint: >-
      Either use RFC 6979 deterministic ECDSA for both signatures, or reword
      the claim to "regenerates an equivalent example" and treat the committed
      JSON and PEM as the normative test vector. The library requirements
      assume the committed artefacts are the vector (STT-TST-001).

  - id: OI-02
    title: One payload per hcert, or several?
    upstream: true
    sources: [qr-2, qr-4, hcert-3.2.7, doc-sd-hcert]
    description: >-
      QR Code Generation 2 and 4 say an HCERT carries exactly one payload and
      that -260 is a "map whose single key is the subclaim". HCERT
      Specification 3.2.7 says "Several different types of health certificate
      MAY exist under the same claim", and the HCert logical model makes every
      subclaim 0..1, so it does not rule out more than one. The verifier
      behaviour for several entries is not specified.
    resolution_hint: State in hcert_spec 3.2.7 whether more than one subclaim per hcert is allowed and how a verifier treats it.

  - id: OI-03
    title: EKU certificate type for non-DCC payloads is undefined
    upstream: true
    sources: [qr-11, hcert-A.2]
    description: >-
      Appendix A.2 defines EKU OIDs for test, vaccinations and recovery, and
      QR Code Generation 11 step 7 says to check the EKU "against the
      certificate type". There is no mapping from subclaims 3, 4, 5, -6 or -7
      to a certificate type. DVC (-6) is presumably "vaccinations". VHL (5) has
      no obvious type.
    resolution_hint: Add a subclaim-to-certificate-type table, or use the GDHCN Key Usage value set.

  - id: OI-04
    title: Base45 reference points at an expired Internet-Draft
    upstream: true
    sources: [qr-8, hcert-4.2.2, std-base45-draft, std-rfc9285]
    description: Both pages cite draft-faltstrom-base45. That draft was published as RFC 9285, which should be the reference.

  - id: OI-05
    title: CBOR reference RFC 7049 is obsoleted by RFC 8949
    upstream: true
    sources: [qr-5, hcert-3.2.7, std-rfc7049, std-rfc8949]
    description: >-
      Neither page says whether issuers should use deterministic encoding, or
      which rules. The reference script uses length-first canonical ordering
      (RFC 7049 section 3.9). For the integer and short text keys used here
      that gives the same order as RFC 8949 core deterministic encoding, but
      that is luck, not a rule.

  - id: OI-06
    title: Subclaim 5 is called VHL in one place and SHL in another
    upstream: true
    sources: [qr-2.1, hcert-3.2.7.1.5, doc-sd-hcert]
    description: >-
      QR Code Generation 2.1 and the HCert logical model describe subclaim 5
      as the URI of a Verifiable Health Link. HCERT Specification 3.2.7.1.5,
      which is the authoritative list, describes it as Smart Health Link (SHL)
      and links the SMART Health Links spec. The two define different URI
      schemes and payloads.

  - id: OI-07
    title: "iss is a string in the spec but a Coding in the logical model"
    upstream: true
    sources: [hcert-3.2.4, doc-sd-cwtpayload]
    description: The CWTPayload logical model types claim 1 as Coding. HCERT 3.2.4 and RFC 8392 type it as a string.

  - id: OI-08
    title: Logical model link in hcert_spec uses a different case
    upstream: true
    sources: [hcert-3.2.1, hcert-3.2.7.1, doc-sd-hcert]
    description: >-
      hcert_spec.md links StructureDefinition-hcert.html. The resource id is
      HCert, so the page is StructureDefinition-HCert.html, which is the link
      QR Code Generation 2.1 uses. On case-sensitive hosting the lowercase
      link breaks.

  - id: OI-09
    title: DVC subclaim -6 is in the development range
    upstream: false
    sources: [qr-2.1]
    description: >-
      The number "is not guaranteed to be stable". The library must not bake
      -6 into its wire format, and has to be able to move DVC to a WHO-assigned
      number without a breaking API change.

  - id: OI-10
    title: Deployed section anchors and preview paths need checking
    upstream: false
    about: kg
    sources: [doc-qr]
    description: >-
      The ci and published URLs for PR 129 content, and every section anchor,
      are computed (see sources.yaml) and cannot be checked until the PR is
      merged and deployed. Re-run tools/build_kg.py --check-links after
      deployment.

  - id: OI-11
    title: No access route is specified for the WHO PreQual vaccine database
    upstream: true
    sources: [qr-3, ext-dvcmin-prequal]
    description: >-
      DVCMinPreQual binds vp to PreQual product identifiers (required binding)
      but there is no FHIR ValueSet, URL or API to resolve them. The library
      can only offer a pluggable validator.

  - id: OI-12
    title: Base64 variant of kid in the DID trustlist is unspecified
    upstream: true
    sources: [did-examples, hcert-A.1]
    description: >-
      The DID trustlist uses a "base64 encoded key id" as the verification
      method fragment and as JWK kid. It does not say whether that is standard
      or URL-safe base64, or whether padding is kept. Standard and URL-safe
      base64 differ on '+' and '/', and the PR example kid WHM+BYqqZiE=
      contains '+'.

  - id: OI-13
    title: Mapping between GDHCN participant codes (alpha-3) and iss (alpha-2)
    upstream: true
    sources: [qr-12.3, hcert-3.2.4, doc-vs-participants]
    description: >-
      Participant codes are ISO 3166-1 alpha-3, while iss and the X.509 C
      attribute use alpha-2. The test pair XXA/XX is user-assigned and not a
      formal ISO mapping. A verifier narrowing trust-list lookups by iss needs
      an authoritative mapping.

  - id: OI-14
    title: Package coordinates and licence for the libraries
    upstream: false
    sources: [dir-languages]
    description: >-
      Maven group / Kotlin package root and crate names are placeholders. The
      natural reverse-DNS root, int.who, cannot be used because `int` is a
      reserved Java keyword. The licence has not been chosen.
