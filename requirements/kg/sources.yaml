  # ---- Stakeholder directives (not in any spec) --------------------------

  - id: dir-languages
    title: "Stakeholder directive: Kotlin library first, Rust library second"
    note: >-
      Given by the requester on 2026-10-20 when commissioning these
      requirements: "API requirements are intended for kotlin (first) and rust
      (second) libraries."

  - id: dir-targets
    title: "Stakeholder directive: transpile targets and API-first"
    note: >-
      Given by the requester on 2026-10-20: Kotlin targets Node, Java (JVM)
      and Android; Rust targets WebAssembly. The API set is to be defined
      and reviewed first, in an OpenAPI-like but non-REST definition.
