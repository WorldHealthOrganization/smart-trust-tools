# Source documents the library requirements are derived from.
#
# Every smart-trust document gets up to four URLs, so that a requirement can be
# traced both today (while WorldHealthOrganization/smart-trust PR #129 is open)
# and after that PR is merged to main and deployed:
#
#   pinned     GitHub blob at the exact commit the requirement was drafted
#              against. Never changes. Always resolvable.
#   preview    IG build of the PR branch (only for documents introduced or
#              changed by an unmerged PR).
#   ci         Continuous build of main. Valid once the change is on main.
#   published  Canonical, released IG. Valid once the change is released.
#
# Section anchors are computed by tools/build_kg.py from the heading text,
# using the same slug rule the IG and GitHub use (lower case, punctuation
# dropped, spaces to hyphens; e.g. "3.2.7 Health Certificate Claim" ->
# "327-health-certificate-claim", as already used by hcert_spec.md itself).

repo: WorldHealthOrganization/smart-trust

refs:
  main:
    sha: e277cce5dcb8d2134ef1625c3a38e27cdf19e835
    label: smart-trust main at time of drafting (IG version 1.7.5 ci-build)
  pr129:
    sha: 50bcb25b387d7e7113ffc9e9046452580f9d67aa
    label: smart-trust PR 129 head (QR Code Generation page)
    pr: 129
    branch: claude/intelligent-bell-usgxfu
    # smart-base resolve_branch.py publishes branch builds under the last
    # path component of the branch name.
    preview_dir: intelligent-bell-usgxfu

sites:
  published: https://smart.who.int/trust
  ci: https://worldhealthorganization.github.io/smart-trust
  preview: https://worldhealthorganization.github.io/smart-trust/branches

# status:
#   deployed       on main and on the published IG
#   pending-merge  introduced or changed by an open PR; ci/published URLs are
#                  where the content will live once merged and deployed
