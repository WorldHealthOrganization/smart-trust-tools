# Upstream (parent) requirements and actors already defined in the smart-trust
# IG as FHIR Requirements / ActorDefinition resources
# (input/fsh/requirements/requirements.fsh, input/fsh/actors/actors.fsh).
# Library requirements point at these with `satisfies`.
#
# Statement keys are reproduced exactly as in the FSH source, including
# existing typos ("reveive", "retreive"), so that they resolve.

actors:
  - {id: actor-issuer, name: Issuer, canonical: "http://smart.who.int/trust/ActorDefinition/Issuer", page: ActorDefinition-Issuer.html}
  - {id: actor-holder, name: Holder, canonical: "http://smart.who.int/trust/ActorDefinition/Holder", page: ActorDefinition-Holder.html}
  - {id: actor-receiver, name: Receiver, canonical: "http://smart.who.int/trust/ActorDefinition/Receiver", page: ActorDefinition-Receiver.html}
  - {id: actor-tnp, name: Trust Network Participant, canonical: "http://smart.who.int/trust/ActorDefinition/TrustNetworkParticipant", page: ActorDefinition-TrustNetworkParticipant.html}

requirements:
  - id: IssuerVDHC
    title: Issue Verifiable Digital Health Certificate
    actor: actor-issuer
    statements:
      - {key: IssuerVDHC-generate, label: "Generate Verifiable Digital Health Certificate", conformance: SHALL}
      - {key: IssuerVDHC-sign, label: "Sign Verifiable Digital Health Certificate", conformance: SHALL}

  - id: ProvideVDHC
    title: Provide Verifiable Digital Health Certificate
    actor: actor-holder
    statements: []

  - id: UtilizeVDHC
    title: Utilize a Verifiable Digital Health Certificate
    actor: actor-receiver
    statements:
      - {key: UtilizeVDHC-reveive, label: "Ingest VDHC", conformance: SHALL}
      - {key: UtilizeVDHC-retreive-keys, label: "Retrieve matching keys", conformance: SHALL}
      - {key: UtilizeVDHC-validate-hash, label: "Validate hash / verify signature", conformance: SHALL}
      - {key: UtilizeVDHC-display-verified-content, label: "Display verified content", conformance: SHALL}
      - {key: UtilizeVDHC-execute-business-rule, label: "Execute business rules", conformance: SHALL}

  - id: RetrievePKIMaterial
    title: Retrieve PKI material
    actor: actor-tnp
    statements: []

  - id: RetrievePKIMaterialDID
    title: Retrieve PKI material as DID
    actor: actor-tnp
    statements: []
