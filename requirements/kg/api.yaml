# Language-neutral API surface the requirements constrain, with the intended
# Kotlin (phase 1) and Rust (phase 2) shapes. The normative contract is the
# WIT in api/wit/. `wit:` names the WIT item (interface.item) each element
# corresponds to, and tools/build_kg.py checks that it exists. The Kotlin
# and Rust lines are design sketches, not frozen signatures. Package and
# crate names are placeholders (see OI-14).
#
# Kotlin:  Kotlin Multiplatform, package root `who.smart.trust` (placeholder)
# Rust:    cargo workspace, crate prefix `smart-trust-` (placeholder)

modules:
  - {id: mod-model, name: model, description: "Subclaim registry, CWT and hcert claim types, payloads", kotlin: "who.smart.trust.model", rust: "smart-trust-model"}
  - {id: mod-payload-dvc, name: payload-dvc, description: "DVCMin typed payload", kotlin: "who.smart.trust.payload.dvc", rust: "smart-trust-payload-dvc"}
  - {id: mod-codec, name: codec, description: "CBOR, ZLIB, Base45, HC1 prefix (pure, no crypto, no I/O)", kotlin: "who.smart.trust.codec", rust: "smart-trust-codec"}
  - {id: mod-cose, name: cose, description: "COSE_Sign1, algorithms, kid, signature formats", kotlin: "who.smart.trust.cose", rust: "smart-trust-cose"}
  - {id: mod-trust, name: trust, description: "Trust store: PEM, DER and GDHCN DID trustlist v2 documents", kotlin: "who.smart.trust.trustlist", rust: "smart-trust-trustlist"}
  - {id: mod-pipeline, name: pipeline, description: "Two-phase HcertIssuer and HcertVerifier", kotlin: "who.smart.trust.hcert", rust: "smart-trust-hcert"}
  - {id: mod-vhl, name: vhl, description: "Verifiable Health Links (IHE ITI VHL): payload, vhlink:/ form, ITI-YY5 request and manifest, JWE, HTTP Message Signatures", kotlin: "who.smart.trust.vhl", rust: "smart-trust-vhl"}
  - {id: mod-testkit, name: testkit, description: "Test vectors, test PKI, fixed clocks. Never a production dependency.", kotlin: "who.smart.trust.testkit", rust: "smart-trust-testkit"}

elements:
  # ---- model --------------------------------------------------------------
  - id: api-subclaim
    name: Subclaim
    module: mod-model
    wit: types.subclaim
    kind: type
    description: "An hcert subclaim number with its title and logical-model canonical URL. Negative numbers are the development range."
    kotlin: "data class Subclaim(val key: Int, val title: String, val logicalModel: String?)"
    rust: "pub struct Subclaim { pub key: i32, pub title: String, pub logical_model: Option<String> }"
  - id: api-subclaim-registry
    name: SubclaimRegistry
    module: mod-model
    wit: subclaims.registry
    kind: interface
    description: "Lookup and registration of subclaims, and which subclaim a payload kind is issued under. Starts with the IG defaults."
    kotlin: "class SubclaimRegistry { fun lookup(key: Int): Subclaim?; fun register(s: Subclaim); fun all(): List<Subclaim>; fun subclaimFor(kind: PayloadKind): Int?; fun setSubclaimFor(kind: PayloadKind, key: Int) }"
    rust: "pub struct SubclaimRegistry { .. } impl SubclaimRegistry { pub fn lookup(&self, key: i32) -> Option<&Subclaim>; pub fn register(&mut self, s: Subclaim); pub fn subclaim_for(&self, kind: PayloadKind) -> Option<i32> }"
  - id: api-payload-codec
    name: PayloadCodec
    module: mod-model
    wit: dvc.to-cbor
    kind: interface
    description: "Converts a typed payload to and from a CBOR data item and validates it against its logical model."
    kotlin: "interface PayloadCodec<T> { val subclaim: Int; fun toCbor(p: T): CborItem; fun fromCbor(i: CborItem): T; fun validate(p: T): List<ValidationIssue> }"
    rust: "pub trait PayloadCodec { type Payload; const SUBCLAIM: i64; fn to_cbor(&self, p: &Self::Payload) -> CborValue; fn from_cbor(&self, v: &CborValue) -> Result<Self::Payload, PayloadError>; fn validate(&self, p: &Self::Payload) -> Vec<ValidationIssue>; }"
  - id: api-raw-payload
    name: RawPayload
    module: mod-model
    wit: payloads.raw-payload
    kind: type
    description: "Opaque CBOR payload for subclaims without a typed codec (DCC 1, DDCC 3/4, VHL 5, MTL -7)."
    kotlin: "data class RawPayload(val subclaim: Int, val item: CborItem)"
    rust: "pub struct RawPayload { pub subclaim: i64, pub item: CborValue }"
  - id: api-cwt
    name: CwtClaims
    module: mod-model
    wit: issuer.issue-request
    kind: type
    description: "CWT claim set: iss (1), iat (6), exp (4), hcert (-260), plus preserved unknown claims."
    kotlin: "data class CwtClaims(val iss: String?, val iat: Instant, val exp: Instant, val hcert: HcertClaim, val other: Map<CborItem, CborItem> = emptyMap())"
    rust: "pub struct CwtClaims { pub iss: Option<String>, pub iat: NumericDate, pub exp: NumericDate, pub hcert: HcertClaim, pub other: BTreeMap<CborValue, CborValue> }"
  - id: api-hcert-claim
    name: HcertClaim
    module: mod-model
    wit: verifier.verified-hcert
    kind: type
    description: "The -260 map. Issuance holds exactly one entry; decoding exposes every entry present."
    kotlin: "class HcertClaim(val entries: Map<Int, CborItem>) { val single: Pair<Int, CborItem>? }"
    rust: "pub struct HcertClaim { pub entries: BTreeMap<i64, CborValue> }"

  # ---- payload-dvc ----------------------------------------------------------
  - id: api-dvcmin
    name: DvcMin
    module: mod-payload-dvc
    wit: dvc.dvc-min
    kind: type
    description: "DVCMin with short element names n, dob, s, nt, id, dt, gn, vx, v."
    kotlin: "data class DvcMin(val n: String, val dob: String, val s: String, val nt: String, val id: String? = null, val dt: String? = null, val gn: String? = null, val vx: DvcMinVaccineDetails, val v: String)"
    rust: "pub struct DvcMin { pub n: String, pub dob: String, pub s: String, pub nt: String, pub id: Option<String>, pub dt: Option<String>, pub gn: Option<String>, pub vx: DvcMinVaccineDetails, pub v: String }"
  - id: api-dvcmin-vx
    name: DvcMinVaccineDetails
    module: mod-payload-dvc
    wit: dvc.dvc-min-vaccine-details
    kind: type
    description: "vp, dv, cn, is, bo."
    kotlin: "data class DvcMinVaccineDetails(val vp: String, val dv: String, val cn: String? = null, val `is`: String? = null, val bo: String)"
    rust: "pub struct DvcMinVaccineDetails { pub vp: String, pub dv: String, pub cn: Option<String>, pub is: Option<String>, pub bo: String }"

  # ---- codec ----------------------------------------------------------------
  - id: api-cbor
    name: Cbor
    module: mod-codec
    wit: codec.cbor-deterministic
    kind: function
    description: "Deterministic CBOR encode; bounded decode."
    kotlin: "object Cbor { fun encode(item: CborItem): ByteArray; fun decode(bytes: ByteArray, limits: DecodeLimits = DecodeLimits.DEFAULT): CborItem }"
    rust: "pub fn encode(v: &CborValue) -> Vec<u8>; pub fn decode(b: &[u8], limits: &DecodeLimits) -> Result<CborValue, CodecError>"
  - id: api-limits
    name: DecodeLimits
    module: mod-codec
    wit: types.decode-limits
    kind: type
    description: "Upper bounds applied while decoding untrusted input: input length, inflated size, CBOR nesting depth, item count, string length."
    kotlin: "data class DecodeLimits(val maxInputChars: Int, val maxInflatedBytes: Int, val maxDepth: Int, val maxItems: Int, val maxStringBytes: Int)"
    rust: "pub struct DecodeLimits { pub max_input_chars: usize, pub max_inflated_bytes: usize, pub max_depth: usize, pub max_items: usize, pub max_string_bytes: usize }"
  - id: api-zlib
    name: Zlib
    module: mod-codec
    wit: codec.zlib-inflate
    kind: function
    description: "ZLIB (RFC 1950) wrapping DEFLATE (RFC 1951)."
    kotlin: "object Zlib { fun compress(b: ByteArray, level: Int = 9): ByteArray; fun inflate(b: ByteArray, maxOut: Int): ByteArray }"
    rust: "pub fn compress(b: &[u8], level: u32) -> Vec<u8>; pub fn inflate(b: &[u8], max_out: usize) -> Result<Vec<u8>, CodecError>"
  - id: api-base45
    name: Base45
    module: mod-codec
    wit: codec.base45-decode
    kind: function
    description: "RFC 9285 Base45, strict decode."
    kotlin: "object Base45 { fun encode(b: ByteArray): String; fun decode(s: String): ByteArray }"
    rust: "pub fn encode(b: &[u8]) -> String; pub fn decode(s: &str) -> Result<Vec<u8>, CodecError>"
  - id: api-hc1
    name: ContextIdentifier
    module: mod-codec
    wit: codec.detect-context
    kind: function
    description: "HC1: prefixing and detection of HC[1-9A-Z]: context identifiers."
    kotlin: "object ContextIdentifier { const val HC1 = \"HC1:\"; fun detect(s: String): ContextId?; fun prefix(b45: String): String }"
    rust: "pub const HC1: &str = \"HC1:\"; pub fn detect(s: &str) -> Option<ContextId>"

  # ---- cose -----------------------------------------------------------------
  - id: api-alg
    name: CoseAlgorithm
    module: mod-cose
    wit: types.cose-algorithm
    kind: enum
    description: "ES256 (-7), PS256 (-37)."
    kotlin: "enum class CoseAlgorithm(val id: Int) { ES256(-7), PS256(-37) }"
    rust: "pub enum CoseAlgorithm { Es256 = -7, Ps256 = -37 }"
  - id: api-kid
    name: Kid
    module: mod-cose
    wit: cose.kid-from-dsc
    kind: type
    description: "8-byte key identifier with derivation from a DER DSC and base64/hex forms."
    kotlin: "@JvmInline value class Kid(val bytes: ByteArray) { companion object { fun fromDsc(der: ByteArray): Kid; fun fromBase64(s: String): Kid }; fun toBase64(): String }"
    rust: "pub struct Kid([u8; 8]); impl Kid { pub fn from_dsc(der: &[u8]) -> Kid; pub fn from_base64(s: &str) -> Result<Kid, KidError>; pub fn to_base64(&self) -> String }"
  - id: api-sign1
    name: CoseSign1
    module: mod-cose
    wit: cose.sign1
    kind: type
    description: "Parsed or built COSE_Sign1: protected bytes, unprotected map, payload, signature."
    kotlin: "class CoseSign1(val protectedBytes: ByteArray, val unprotected: Map<Int, CborItem>, val payload: ByteArray, val signature: ByteArray) { fun sigStructure(): ByteArray; val alg: CoseAlgorithm?; val kid: Kid? }"
    rust: "pub struct CoseSign1 { pub protected: Vec<u8>, pub unprotected: BTreeMap<i64, CborValue>, pub payload: Vec<u8>, pub signature: Vec<u8> }"
  - id: api-ecdsa-format
    name: EcdsaSignatureFormat
    module: mod-cose
    wit: cose.ecdsa-der-to-raw
    kind: function
    description: "Conversion between ASN.1 DER ECDSA-Sig-Value and fixed-width r||s."
    kotlin: "object EcdsaSignatureFormat { fun derToRaw(der: ByteArray, n: Int = 32): ByteArray; fun rawToDer(raw: ByteArray): ByteArray }"
    rust: "pub fn der_to_raw(der: &[u8], n: usize) -> Result<Vec<u8>, SigFormatError>; pub fn raw_to_der(raw: &[u8]) -> Result<Vec<u8>, SigFormatError>"

  # ---- trust ----------------------------------------------------------------
  - id: api-trust-provider
    name: TrustListProvider
    module: mod-trust
    wit: trust.trust-store
    kind: interface
    description: "Holds the trusted DSCs the host loaded and returns every one matching a kid. The host does the fetching; the store does no I/O."
    kotlin: "class TrustStore { fun addPem(pem: String): Int; fun addDer(der: ByteArray): Int; fun addDidDocument(json: String): Int; fun candidates(kid: Kid): List<TrustedDsc> }"
    rust: "pub struct TrustStore { .. } impl TrustStore { pub fn add_pem(&mut self, pem: &str) -> Result<u32, TrustError>; pub fn candidates(&self, kid: &Kid) -> Vec<TrustedDsc> }"
  - id: api-did-trustlist
    name: TrustStore.addDidDocument
    module: mod-trust
    wit: trust.trust-store
    kind: function
    description: "Reads the DSCs of a GDHCN DID trustlist v2 document (embedded or reference variant) into the store: verificationMethod publicKeyJwk x5c, kid from the fragment."
    kotlin: "fun TrustStore.addDidDocument(json: String): Int"
    rust: "pub fn add_did_document(&mut self, json: &str) -> Result<u32, TrustError>"
  - id: api-static-trust
    name: StaticTrustList
    module: mod-trust
    wit: trust.trust-store
    kind: type
    description: "DSCs loaded from PEM or DER, for tests, pinned national lists and fully offline deployments."
    kotlin: "TrustStore().apply { addPem(pem) }"
    rust: "let mut store = TrustStore::new(); store.add_pem(pem)?;"

  # ---- pipeline -------------------------------------------------------------
  - id: api-pending-signature
    name: PendingSignature
    module: mod-pipeline
    wit: issuer.pending-signature
    kind: type
    description: "Result of issuer.prepare: the exact bytes to sign, the algorithm and the kid. Consumed by issuer.finish."
    kotlin: "class PendingSignature : AutoCloseable { val toBeSigned: ByteArray; val algorithm: CoseAlgorithm; val kid: Kid }"
    rust: "pub struct PendingSignature { .. } impl PendingSignature { pub fn to_be_signed(&self) -> &[u8] }"
  - id: api-issuer
    name: HcertIssuer
    module: mod-pipeline
    wit: issuer.prepare
    kind: function
    description: "Two-phase issuance, steps 3 to 8: prepare validates and builds the CWT, CBOR and protected header and returns the bytes to sign; finish attaches the signature and returns the HC1 string and the COSE bytes. No private key in process."
    kotlin: "object HcertIssuer { fun prepare(req: IssueRequest, registry: SubclaimRegistry): PendingSignature; fun finish(pending: PendingSignature, signature: ByteArray): IssuedHcert }"
    rust: "pub fn prepare(req: &IssueRequest, registry: &SubclaimRegistry) -> Result<PendingSignature, IssueError>; pub fn finish(pending: PendingSignature, signature: &[u8]) -> Result<IssuedHcert, IssueError>"
  - id: api-verifier
    name: HcertVerifier
    module: mod-pipeline
    wit: verifier.verify
    kind: function
    description: "Runs QR Code Generation section 11 over an HC1 string and returns a VerificationResult."
    kotlin: "object HcertVerifier { fun verify(hc1: String, trust: TrustStore, registry: SubclaimRegistry, now: Long, options: VerifierOptions): VerificationResult }"
    rust: "pub fn verify(hc1: &str, trust: &TrustStore, registry: &SubclaimRegistry, now: i64, options: &VerifierOptions) -> VerificationResult"
  - id: api-unverified
    name: HcertVerifier.readUnverified
    module: mod-pipeline
    wit: verifier.read-unverified
    kind: function
    description: "Decodes an HC1 string to its claims and payload with no trust lookup or signature check, for offline triage. The result type says it is unverified."
    kotlin: "fun readUnverified(hc1: String, limits: DecodeLimits): WitResult<UnverifiedHcert, VerificationFailure>"
    rust: "pub fn read_unverified(hc1: &str, limits: &DecodeLimits) -> Result<UnverifiedHcert, VerificationFailure>"
  - id: api-result
    name: VerificationResult
    module: mod-pipeline
    wit: verifier.verification-result
    kind: type
    description: "Either Verified(claims, payload, dsc, diagnostics) or Failed(step, reason, diagnostics). Payload content is only reachable from Verified."
    kotlin: "sealed interface VerificationResult { data class Verified(...) : VerificationResult; data class Failed(val step: Step, val reason: FailureReason, ...) : VerificationResult }"
    rust: "pub enum VerificationResult { Verified(VerifiedHcert), Failed(VerificationFailure) }"

  # ---- vhl ------------------------------------------------------------------
  - id: api-vhl-payload
    name: VhlPayload
    module: mod-vhl
    wit: vhl.vhl-payload
    kind: type
    description: "The SMART Health Links payload format IHE VHL reuses, with validation; a CBOR map at HCERT key 5."
    kotlin: "data class VhlPayload(val url: String, val key: String, val exp: Long?, val flag: String?, val label: String?, val v: Int?, val fhirBaseUrl: String?)"
    rust: "pub struct VhlPayload { pub url: String, pub key: String, pub exp: Option<i64>, pub flag: Option<String>, pub label: Option<String>, pub v: Option<i32>, pub fhir_base_url: Option<String> }"
  - id: api-vhl-link
    name: Vhl.toVhlink / fromVhlink
    module: mod-vhl
    wit: vhl.to-vhlink
    kind: function
    description: "The vhlink:/ text form: minified JSON, base64url, prefixed."
    kotlin: "fun toVhlink(p: VhlPayload): String; fun fromVhlink(text: String): WitResult<VhlPayload, VhlError>"
    rust: "pub fn to_vhlink(p: &VhlPayload) -> String; pub fn from_vhlink(s: &str) -> Result<VhlPayload, VhlError>"
  - id: api-vhl-key
    name: Vhl.newKey
    module: mod-vhl
    wit: vhl.new-key
    kind: function
    description: "32 bytes from the platform CSPRNG, 43 base64url characters."
    kotlin: "fun newKey(): String"
    rust: "pub fn new_key() -> String"
  - id: api-vhl-manifest-request
    name: Vhl.buildManifestRequest
    module: mod-vhl
    wit: vhl.build-manifest-request
    kind: function
    description: "Builds the ITI-YY5 POST <base>/List/_search form request; the host sends it."
    kotlin: "fun buildManifestRequest(p: VhlPayload, recipient: String, passcode: String?, embeddedLengthMax: Int?): WitResult<ManifestRequest, VhlError>"
    rust: "pub fn build_manifest_request(p: &VhlPayload, recipient: &str, passcode: Option<&str>, embedded_length_max: Option<u32>) -> Result<ManifestRequest, VhlError>"
  - id: api-vhl-manifest
    name: Vhl.parseManifest
    module: mod-vhl
    wit: vhl.parse-manifest
    kind: function
    description: "Reads the ITI-YY5 searchset Bundle into document URLs or references, with their decrypted content types."
    kotlin: "fun parseManifest(bundleJson: String): WitResult<List<ManifestDocument>, VhlError>"
    rust: "pub fn parse_manifest(json: &str) -> Result<Vec<ManifestDocument>, VhlError>"
  - id: api-vhl-jwe
    name: Vhl.encrypt / decrypt
    module: mod-vhl
    wit: vhl.decrypt
    kind: function
    description: "JWE Compact, dir / A256GCM, with the payload key."
    kotlin: "fun encrypt(content: ByteArray, contentType: String, key: String): WitResult<String, VhlError>; fun decrypt(jwe: String, key: String): WitResult<Decrypted, VhlError>"
    rust: "pub fn encrypt(content: &[u8], cty: &str, key: &str) -> Result<String, VhlError>; pub fn decrypt(jwe: &str, key: &str) -> Result<Decrypted, VhlError>"
  - id: api-vhl-http-signature
    name: Vhl.buildSignatureBase / signatureHeader
    module: mod-vhl
    wit: vhl.build-signature-base
    kind: function
    description: "RFC 9421 signature base and RFC 9530 Content-Digest for the receiver; the host signs the base."
    kotlin: "fun buildSignatureBase(r: SignatureRequest): SignatureBase; fun signatureHeader(signature: ByteArray, alg: String): WitResult<String, VhlError>"
    rust: "pub fn build_signature_base(r: &SignatureRequest) -> SignatureBase; pub fn signature_header(sig: &[u8], alg: &str) -> Result<String, VhlError>"

  # ---- testkit --------------------------------------------------------------
  - id: api-testkit
    name: TestVectors
    module: mod-testkit
    wit_note: "Test-only; not part of the shipped contract."
    kind: type
    description: "Shared, language-neutral conformance vectors (JSON + PEM) and loaders in both languages."
    kotlin: "object TestVectors { val dvcXxa: List<HcertVector> }"
    rust: "pub fn dvc_xxa() -> Vec<HcertVector>"
